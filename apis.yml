name: Neo Financial
kind: company
description: >-
  Neo Financial is a Calgary- and Winnipeg-based Canadian fintech (neobank)
  founded in 2019 by the founders of SkipTheDishes, offering credit cards,
  savings, money, investing, and mortgage products to consumers. Neo is not a
  chartered bank and holds no Canadian banking licence; it delivers
  CDIC-eligible deposits and card issuance through regulated partner
  institutions — Peoples Bank of Canada for everyday accounts, ATB Financial as
  Mastercard credit-card issuer, and formerly Concentra Bank (now part of
  Equitable Bank) for savings. Neo operates a consumer mobile and web platform
  only and publishes no first-party public developer API or developer portal;
  third-party access to Neo accounts today is available solely through data
  aggregators such as Flinks (a National Bank-owned Canadian aggregator) and
  Plaid via credential/screen-scraping access, not a documented first-party
  API. Canada's federal Consumer-Driven Banking (open banking) framework,
  legislated in Budget 2024 and overseen by the Financial Consumer Agency of
  Canada, is not yet operational, so no first-party FDX or CDB data API exists.
  Neo maintains a public GitHub organization of internal engineering tooling and
  an engineering blog, but ships no public API products.
