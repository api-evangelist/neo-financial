aid: neo-financial
name: Neo Financial
review:
  question: Does Neo Financial expose a public first-party developer API or developer portal?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Neo Financial publishes no public first-party developer API and no
    developer portal. Probes of developer.neofinancial.com,
    developers.neofinancial.com, api.neofinancial.com, and
    docs.neofinancial.com all fail to resolve (curl exit / HTTP 000 — no DNS,
    no host). Neo is a Canadian fintech (neobank), not a chartered bank, and
    holds no banking licence; it is a consumer mobile/web product only.
    Regulated banking functions are delivered through partner institutions
    (Peoples Bank of Canada for everyday accounts, ATB Financial as Mastercard
    credit-card issuer, formerly Concentra Bank / now Equitable Bank for
    savings), none of which surface a Neo-branded public API.

    Third-party access to Neo accounts today is aggregator-only: consumer data
    is reachable through Flinks (a National Bank-owned Canadian aggregator) and
    Plaid via credential/screen-scraping access, not a documented first-party
    API. Open Banking Tracker lists "No API products" for Neo and names Flinks
    as the supported connectivity path.

    No downloadable OpenAPI/Swagger definition was found or harvested (none is
    published). No FDX participation is documented, and Neo publishes no
    Consumer-Driven Banking (CDB) posture — Canada's federal Consumer-Driven
    Banking framework (Budget 2024, FCAC-overseen) is legislated but not yet
    operational, so no first-party CDB/FDX data API exists. No US "1033"
    posture applies (Neo is a Canadian entity). Because there is no public API,
    no authentication model (OAuth2/OIDC/API-key/mTLS) is documented for any
    developer-facing surface.

    Neo does operate a public GitHub organization (github.com/neofinancial,
    ~19 repos of internal engineering tooling — ESLint config, Serverless
    plugins, GitHub Actions, GraphQL scalars; no API specs) and an engineering
    blog (engineering.neofinancial.com).
  charterType: Fintech / neobank (not a chartered bank; no Canadian banking licence)
