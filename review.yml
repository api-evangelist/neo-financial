actions:
  apisListed: 0
  openapiHarvested: false
  reason: |
    Identity-only bootstrap. Neo Financial exposes no public first-party API,
    no developer portal, and no downloadable spec, so no apis[] entries and no
    openapi/ artifacts were created. Data access to Neo accounts is
    aggregator-only (Flinks, Plaid). This is the honest, non-fabricated result
    for a Canadian consumer neobank under a voluntary, not-yet-operational open
    banking regime.
